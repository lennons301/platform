name: Estate Conformity Check
on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * *'   # daily 06:00 UTC — catches drift without a platform push
  workflow_dispatch:

permissions:
  contents: write        # push the snapshot feed branch (never the default branch)
  pull-requests: write   # open the snapshot PR
  issues: write          # raise the feed alarm on failure

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
        # jq is preinstalled on ubuntu-latest runners

      - name: Run shell tests
        run: ./checks/tests/run-tests.sh

      - name: Clone product repos
        run: |
          mkdir -p /tmp/repos
          for f in products/*.yaml; do
            name=$(yq '.name' "$f")
            repo=$(yq '.repo' "$f")
            status=$(yq '.status' "$f")
            if [ "$status" = "archived" ]; then continue; fi
            gh repo clone "$repo" "/tmp/repos/$name" -- --depth 1 || echo "WARN: failed to clone $repo"
          done
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Run conformity checks and emit snapshot
        id: snapshot
        run: |
          mkdir -p data
          ./checks/check-estate.sh --repos-dir /tmp/repos --json data/conformity-snapshot.json
        env:
          # check-review-gate.sh reads repo settings, branch protection, labels
          # and collaborators via the API; without a token it warns and skips.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # Belt and braces: whatever happens to the steps below, the run this
      # snapshot came from carries a downloadable copy of it.
      - name: Upload snapshot artifact
        if: always() && steps.snapshot.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: conformity-snapshot
          path: data/conformity-snapshot.json
          retention-days: 90

      # Gap-filing comes BEFORE persisting the snapshot, and persisting runs
      # even if gap-filing fails. The two used to be coupled the other way
      # round: a rejected push aborted the job and a month of gap issues went
      # unfiled as collateral damage of a bookkeeping step.
      - name: Create issues for gaps
        if: steps.snapshot.outcome == 'success'
        run: ./checks/create-issues.sh --snapshot data/conformity-snapshot.json
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # This repo is subject to the reviewer flow it publishes, so the snapshot
      # cannot be pushed to the protected default branch. It goes to a feed
      # branch every run, and onto the default branch by PR when the conformity
      # content actually changed. A failure here still fails the run.
      - name: Publish snapshot
        if: always() && steps.snapshot.outcome == 'success'
        run: |
          ./scripts/snapshot-publish.sh \
            --snapshot data/conformity-snapshot.json \
            --repo "$GITHUB_REPOSITORY" \
            --base "${{ github.event.repository.default_branch }}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # Scheduled failures are invisible unless something says so out loud.
      # The watchdog catches a job that never ran at all; this catches the
      # one that ran and broke.
      - name: Raise the feed alarm
        if: failure()
        run: |
          # Exit 1 means "alarm raised" — expected here, the run is already
          # red. Exit 2 means the alarm itself failed and must not be swallowed.
          ./scripts/conformity-alarm.sh \
            --repo "$GITHUB_REPOSITORY" \
            --failed-run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            || [ "$?" -eq 1 ]
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
